<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polygon 360-rundvisninger</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: white sidebar + card grid like a property CRM; viewer uses floating white controls over the photo */
  --bg:#F8FAFC; --surface:#FFFFFF; --ink:#0F172A; --muted:#64748B; --line:#E2E8F0; --tint:#F1F5F9;
  --accent:#00AEEF; --accent-ink:#FFFFFF;
  --good:#1E7F4F; --warn:#A15C07; --crit:#C2362A; --water:#1F6FB2;
  --f-display:"Inter","Inter Fallback",system-ui,-apple-system,sans-serif;
  --f-body:"Inter","Inter Fallback",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#020817; --surface:#0B1220; --ink:#F1F5F9; --muted:#94A3B8; --line:#1E293B; --tint:#111A2E;
    --good:#4FB880; --warn:#E3A33C; --crit:#EE6A5A; --water:#5AA9E6;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#020817; --surface:#0B1220; --ink:#F1F5F9; --muted:#94A3B8; --line:#1E293B; --tint:#111A2E;
  --good:#4FB880; --warn:#E3A33C; --crit:#EE6A5A; --water:#5AA9E6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- 360 player: floating white controls over the photo ---------- */
.p3{position:relative;width:100%;height:100%;overflow:hidden;background:#0d0e10;color:#151821;font-family:var(--f-body);-webkit-user-select:none;user-select:none;overscroll-behavior:contain;
  --p3-accent:var(--accent,#00AEEF);--p3-accent-ink:var(--accent-ink,#fff);--p3-card:rgba(255,255,255,.96);--p3-ink:#151821;--p3-muted:#5F6672;--p3-line:#E3E6EB;
  --p3-sh:0 2px 6px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.18)}
.p3-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;cursor:grab;touch-action:none}
.p3-canvas:active{cursor:grabbing}
.p3.tooling .p3-canvas{cursor:crosshair}
.p3-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
.p3-hot{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.p3-card{background:var(--p3-card);color:var(--p3-ink);border-radius:14px;box-shadow:var(--p3-sh);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* floor rings for walk-through links */
.p3-ring{fill:rgba(255,255,255,.22);stroke:#fff;stroke-width:3;stroke-linejoin:round}
.p3-ring-in{fill:#fff;stroke:none;opacity:.95}
.p3-ring.sel{stroke:var(--p3-accent)}

/* measurement overlay */
.p3-ml-c{stroke:rgba(0,0,0,.5);stroke-width:5;stroke-linecap:round}
.p3-ml{stroke:#fff;stroke-width:2;stroke-linecap:round}
.p3-ml.draft{stroke:var(--p3-accent);stroke-dasharray:6 5}
.p3-ml.outline{stroke:var(--p3-accent)}
.p3-poly{fill:rgba(255,255,255,.16);stroke:none}
.p3-poly.outline{fill:rgba(0,174,239,.16)}
.p3-md{fill:#fff;stroke:rgba(0,0,0,.55);stroke-width:1.5}
.p3-md.draft{fill:var(--p3-accent)}
.p3-md.first{fill:var(--p3-accent);stroke:#fff;stroke-width:2}
.p3-mt{font-family:var(--f-mono);font-size:13px;font-weight:500;fill:#151821;stroke:#fff;stroke-width:5;paint-order:stroke;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums}
.p3-mt.small{font-size:11px}
.p3-mt.draft{fill:var(--p3-accent)}

/* hotspots */
.p3-hs{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;border:0;background:none;color:var(--p3-ink);pointer-events:auto;display:grid;place-items:center;will-change:transform;-webkit-tap-highlight-color:transparent}
.p3-hs-dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .15s;border:3px solid #fff}
.p3-hs:hover .p3-hs-dot,.p3-hs:focus-visible .p3-hs-dot{transform:scale(1.12)}
.p3-hs .ic{width:18px;height:18px}
.p3-nav .p3-hs-dot{background:var(--p3-accent);color:var(--p3-accent-ink)}
.p3-nav.floor{width:72px;height:72px;margin:-36px 0 0 -36px}
.p3-nav.floor .p3-hs-dot{opacity:0}
.p3-k-info .p3-hs-dot{color:#3B4656;border-color:#3B4656}
.p3-k-damage .p3-hs-dot{color:#C2362A;border-color:#C2362A}
.p3-k-moisture .p3-hs-dot{color:#1F6FB2;border-color:#1F6FB2}
.p3-k-equipment .p3-hs-dot{color:#8A6A12;border-color:#8A6A12}
.p3-blur .p3-hs-dot{background:rgba(255,255,255,.6);border-style:dashed;border-color:#151821}
.p3-hs-label{position:absolute;bottom:calc(100% - 4px);left:50%;transform:translateX(-50%);max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 10px;border-radius:999px;background:#fff;color:var(--p3-ink);box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:12.5px;font-weight:600;line-height:1.4;pointer-events:none}
.p3-tag .p3-hs-label{bottom:auto;top:calc(100% - 2px)}
.p3-nav.floor .p3-hs-label{bottom:calc(50% + 8px)}
.p3.hide-tags .p3-tag{display:none !important}
.p3-hs.sel .p3-hs-dot{outline:3px solid var(--p3-accent);outline-offset:3px}
.p3-nav.floor.sel .p3-hs-dot{opacity:1;width:16px;height:16px}

/* top */
.p3-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:10px;padding:12px;pointer-events:none}
.p3-top>*{pointer-events:auto}
.p3-slot{display:flex;align-items:center;gap:8px;flex:none}
.p3-slot-r{margin-left:auto}
.p3-head{display:flex;align-items:center;gap:12px;min-width:0;max-width:min(560px,100%);padding:8px 14px 8px 10px;pointer-events:auto}
.p3-brand{flex:none;display:flex;align-items:center;max-width:132px;overflow:hidden;padding-right:12px;border-right:1px solid var(--p3-line)}
.p3-brand:empty{display:none}
.p3-brand img{max-height:30px;max-width:132px;display:block}
.p3-brand span{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;color:var(--p3-ink)}
.p3-titles{min-width:0;flex:1 1 auto}
.p3-title{font-family:var(--f-display);font-weight:700;font-size:15.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p3-scene{font-size:12.5px;color:var(--p3-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}

/* buttons */
.p3-btn{position:relative;width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--p3-card);color:var(--p3-ink);display:grid;place-items:center;padding:0;box-shadow:var(--p3-sh);transition:background .15s,color .15s}
.p3-btn:hover{background:#fff;color:var(--p3-accent)}
.p3-btn.on{background:var(--p3-accent);color:var(--p3-accent-ink)}
.p3-btn.txt{width:auto;border-radius:999px;padding:0 16px;display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:14px;white-space:nowrap}
.p3-btn .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--p3-accent);color:var(--p3-accent-ink);font:600 11px/18px var(--f-mono);padding:0 4px}
.p3-tools{position:absolute;right:12px;top:72px;display:flex;flex-direction:column;gap:10px}
.p3.editing .p3-tools{top:128px}

/* edit bar */
.p3-editbar{position:absolute;left:0;right:0;top:68px;display:flex;gap:8px;padding:0 12px 6px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
.p3-editbar::-webkit-scrollbar{display:none}
.eb-btn{flex:none;height:42px;padding:0 14px;border-radius:999px;border:0;background:var(--p3-card);color:var(--p3-ink);display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;white-space:nowrap;box-shadow:var(--p3-sh)}
.eb-btn .ic{width:18px;height:18px}
.eb-btn:hover{color:var(--p3-accent)}
.eb-btn.on{background:var(--p3-accent);color:var(--p3-accent-ink)}
.eb-sep{flex:none;width:1px;margin:8px 2px;background:rgba(255,255,255,.5)}

/* bottom */
.p3-bottom{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;gap:12px;padding:12px;pointer-events:none}
.p3-bottom>*{pointer-events:auto}
.p3-bcol{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.p3-bcol>*{pointer-events:auto}
.p3-mini{flex:none;width:176px;height:132px;padding:6px;border:0;display:block;overflow:hidden}
.p3-mini svg{width:100%;height:100%;display:block}
.p3-strip{max-width:min(100%,980px);padding:4px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.p3-strip-tab{height:22px;padding:0 10px;border:0;border-radius:999px;background:none;color:var(--p3-muted);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.p3-strip-tab:hover{color:var(--p3-ink)}
.p3-strip-tab .ic{width:14px;height:14px;transition:transform .2s}
.p3-strip.closed .p3-strip-tab .ic{transform:rotate(180deg)}
.p3-strip.closed .p3-strip-row{display:none}
.p3-strip-row{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:2px;scrollbar-width:thin;touch-action:pan-x}
.p3-thumb{position:relative;flex:none;width:88px}
.p3-thumb-b{display:block;width:100%;padding:0;border:0;border-radius:10px;background:#E8EAEE;overflow:hidden;color:var(--p3-ink);text-align:left;box-shadow:inset 0 0 0 2px transparent}
.p3-thumb.on .p3-thumb-b{box-shadow:0 0 0 3px var(--p3-accent)}
.p3-thumb-img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#E8EAEE}
.p3-thumb-name{display:block;padding:3px 6px 4px;font-size:11px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff}
.p3-thumb-m{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:#fff;color:var(--p3-ink);display:grid;place-items:center;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.p3-thumb-m .ic{width:16px;height:16px}
.p3-thumb-add{flex:none;width:88px;border:2px dashed #C9CED6;border-radius:10px;background:var(--p3-tint,#F7F8FA);color:var(--p3-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;padding:6px}
.p3-thumb-add:hover{border-color:var(--p3-accent);color:var(--p3-accent)}

/* panel */
.p3-panel{align-self:flex-start;width:360px;max-width:100%;max-height:min(50vh,460px);overflow:auto;padding:14px 16px 16px;-webkit-user-select:text;user-select:text;touch-action:pan-y}
.p3-panel h3{margin:0;font:700 16.5px/1.25 var(--f-display)}
.p3-ph{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.p3-ph h3{flex:1;min-width:0}
.p3-x{width:32px;height:32px;border:0;border-radius:50%;background:#EEF0F3;color:var(--p3-ink);display:grid;place-items:center;padding:0;flex:none}
.p3-x:hover{background:#E2E5EA}
.p3-seg{display:flex;gap:4px;padding:3px;border-radius:10px;background:#EEF0F3;margin-bottom:10px}
.p3-seg button{flex:1;height:36px;border:0;border-radius:8px;background:none;color:var(--p3-muted);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 6px}
.p3-seg button .ic{width:16px;height:16px}
.p3-seg button.on{background:#fff;color:var(--p3-ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.p3-hint{font-size:13.5px;color:var(--p3-muted);margin:0 0 10px}
.p3-mlist{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:4px}
.p3-mlist li{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;background:#F3F4F6;font-size:13.5px}
.p3-mlist .v{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
.p3-mlist button{width:28px;height:28px;border:0;border-radius:6px;background:none;color:var(--p3-muted);display:grid;place-items:center;padding:0;flex:none}
.p3-mlist button:hover{color:var(--crit,#C2362A);background:#fff}
.p3-mlist .ic{width:16px;height:16px}
.p3-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.p3-mini-btn{height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--p3-line);background:#fff;color:var(--p3-ink);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.p3-mini-btn:hover{border-color:#B9BFC9}
.p3-mini-btn.pri{background:var(--p3-accent);color:var(--p3-accent-ink);border-color:transparent}
.p3-mini-btn .ic{width:16px;height:16px}
.p3-note{font-size:12px;color:var(--p3-muted);margin:10px 0 0}
.p3-camh{font-family:var(--f-mono);font-size:12.5px;color:var(--p3-muted);margin-left:auto}
.p3-kchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 7px;border-radius:999px;font:700 11.5px/1 var(--f-body);letter-spacing:.03em;text-transform:uppercase;color:#fff;background:#3B4656}
.p3-kchip .ic{width:14px;height:14px}
.p3-kchip.damage{background:#C2362A}.p3-kchip.moisture{background:#1F6FB2}.p3-kchip.equipment{background:#8A6A12}
.p3-tagtext{white-space:pre-wrap;font-size:14.5px;line-height:1.5;margin:8px 0 0;color:#2A2F38}
.p3-tagphoto{display:block;max-width:100%;border-radius:10px;margin-top:10px}
.p3-tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.p3-tl button{width:100%;display:flex;align-items:center;gap:10px;padding:8px;border:0;border-radius:9px;background:#F3F4F6;color:var(--p3-ink);text-align:left}
.p3-tl button:hover{background:#E9EBEF}
.p3-tl .t{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p3-tl .s{font-size:12px;color:var(--p3-muted);white-space:nowrap}
.p3-kdot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:#3B4656;color:#fff}
.p3-kdot .ic{width:14px;height:14px}
.p3-kdot.damage{background:#C2362A}.p3-kdot.moisture{background:#1F6FB2}.p3-kdot.equipment{background:#8A6A12}
.p3-check{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-top:10px}

/* plans (white paper, dark lines) */
.p3-planbig{position:absolute;inset:0;background:#fff;color:var(--p3-ink);display:flex;flex-direction:column;z-index:5}
.p3-planbig .p3-ph{padding:12px 14px;margin:0;border-bottom:1px solid var(--p3-line)}
.p3-planbig svg{flex:1;min-height:0;width:100%;touch-action:none}
.pl-room{fill:rgba(21,24,33,.05);stroke:#2A2F38;stroke-linejoin:round}
.pl-room.on{fill:rgba(233,96,12,.14);stroke:var(--p3-accent)}
.pl-room.sel{stroke:var(--p3-accent);fill:rgba(233,96,12,.12)}
.pl-pick{cursor:pointer}
.pl-pin{fill:#fff;stroke:#2A2F38}
.pl-pin.on{fill:var(--p3-accent);stroke:#fff}
.pl-cone{fill:var(--p3-accent);opacity:.45}
.pl-name{fill:#151821;font-family:var(--f-display);font-weight:700;text-anchor:middle}
.pl-area{fill:#5F6672;font-family:var(--f-mono);text-anchor:middle}
.pl-dim{fill:#5F6672;font-family:var(--f-mono);text-anchor:middle;dominant-baseline:central}
.pl-scale{stroke:#151821;fill:none}
.pl-scale-t{fill:#151821;font-family:var(--f-mono)}

/* misc */
.p3-toast{position:absolute;left:50%;top:78px;transform:translateX(-50%);max-width:min(88%,420px);padding:10px 16px;border-radius:999px;background:#151821;color:#fff;font-size:13.5px;font-weight:600;text-align:center;z-index:8;pointer-events:none;box-shadow:var(--p3-sh)}
.p3.editing .p3-toast{top:132px}
.p3-loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:#fff;color:var(--p3-ink);font-size:14px;font-weight:600;pointer-events:none;box-shadow:var(--p3-sh)}
.p3-spin{width:18px;height:18px;border-radius:50%;border:2.5px solid #E2E5EA;border-top-color:var(--p3-accent);animation:p3spin .8s linear infinite}
@keyframes p3spin{to{transform:rotate(360deg)}}
.p3-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;pointer-events:none}
.p3-empty>div{max-width:380px;pointer-events:auto;background:#fff;color:var(--p3-ink);border-radius:16px;padding:24px;box-shadow:var(--p3-sh)}
.p3-empty h2{font:700 22px/1.2 var(--f-display);margin:0 0 8px}
.p3-empty p{margin:0 0 16px;color:var(--p3-muted);font-size:14.5px}
.p3-overlay{position:absolute;inset:0;pointer-events:none;z-index:10}
.p3-overlay>*{pointer-events:auto}

/* password screen of exported files */
.p3-lock{min-height:100%;display:grid;place-items:center;padding:20px;background:#F3F4F6;font-family:var(--f-body);color:#151821}
.p3-lock form{width:min(400px,100%);background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(16,24,40,.12);padding:26px 24px;display:flex;flex-direction:column;gap:12px}
.p3-lock .lb{display:flex;align-items:center;min-height:34px}
.p3-lock .lb img{max-height:34px;max-width:180px}
.p3-lock .lb span{font:800 20px var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.p3-lock h1{margin:6px 0 0;font:700 21px/1.25 var(--f-display)}
.p3-lock p{margin:0;color:#5F6672;font-size:14px}
.p3-lock input{height:46px;padding:0 14px;border:1px solid #D5D9E0;border-radius:10px;font-size:16px;font-family:var(--f-mono)}
.p3-lock input:focus{outline:0;border-color:var(--accent,#E9600C);box-shadow:0 0 0 3px rgba(233,96,12,.2)}
.p3-lock button{height:46px;border:0;border-radius:999px;background:var(--accent,#E9600C);color:#fff;font-weight:700;font-size:15px}
.p3-lock button:disabled{opacity:.6}
.p3-lock .err{color:#C2362A;font-weight:600}
.p3-lock small{color:#8A909B;font-size:12px}

@media (min-width:760px){.p3-title{font-size:17px}}
@media (max-width:759px){
  .p3-bottom{flex-direction:column;align-items:stretch;gap:8px;padding:10px}
  .p3-mini{width:132px;height:98px}
  .p3.has-panel .p3-mini{display:none}
  .p3-brand{max-width:84px;padding-right:10px}
  .p3-brand img{max-width:84px;max-height:24px}
  .p3-brand span{font-size:14px}
  .p3-head{padding:7px 12px 7px 9px}
  .p3-title{font-size:14px}
  .p3-thumb,.p3-thumb-add{width:76px}
  .p3-panel{width:100%}
}
@media (max-height:540px){
  .p3-tools{flex-wrap:wrap-reverse;max-height:calc(100% - 80px)}
  .p3-strip-row{display:none}
  .p3-mini{display:none}
}
/* floor levels and room overview */
.p3-levels{display:flex;gap:4px;flex-wrap:wrap}
.p3-levels:empty{display:none}
.p3-levels button{border:1px solid var(--p3-line);background:#fff;border-radius:999px;padding:4px 10px;font-size:13px;color:var(--p3-ink)}
.p3-levels button.on{background:var(--p3-accent);border-color:var(--p3-accent);color:var(--p3-accent-ink)}
.p3-rsum{margin:0 0 10px;font-size:13px;color:var(--p3-muted)}
.p3-rlevel{margin:12px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--p3-muted)}
.p3-room{border:1px solid var(--p3-line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.p3-room.on{border-color:var(--p3-accent)}
.p3-room-h{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 10px;border:0;background:#F7F8FA;color:var(--p3-ink);text-align:left}
.p3-room-h .t{font-weight:600}
.p3-room-h .s{font-size:12.5px;color:var(--p3-muted)}
.p3-items{list-style:none;margin:0;padding:4px 6px 6px;display:flex;flex-direction:column}
.p3-items button{width:100%;display:flex;gap:8px;align-items:baseline;border:0;background:none;padding:5px 4px;border-radius:6px;text-align:left;color:var(--p3-ink);font-size:13.5px}
.p3-items button:hover{background:#F3F4F6}
.p3-items .t{flex:1}
.p3-items .n{color:var(--p3-muted);font-variant-numeric:tabular-nums}
.p3-rnote{margin:0;padding:0 10px 9px;font-size:12.5px;color:var(--p3-muted)}
/* 3D scan (LiDAR) layer */
.p3-m3{position:absolute;inset:0;background:#EEF0F4}
.p3-m3[hidden]{display:none}
.p3-m3-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
.p3-m3-canvas:active{cursor:grabbing}
.p3-m3.measuring .p3-m3-canvas{cursor:crosshair}
.p3-m3-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.p3-m3-svg line{stroke:var(--p3-accent);stroke-width:2.5;stroke-linecap:round}
.p3-m3-svg line.c{stroke:#fff;stroke-width:5.5}
.p3-m3-svg circle{fill:#fff;stroke:var(--p3-accent);stroke-width:2.5}
.p3-m3-svg text{font:700 14px var(--f-body);fill:#151821;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;text-anchor:middle}
.p3-m3-bar{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:2px;padding:4px;border-radius:999px;white-space:nowrap}
.p3-m3-b{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:0;border-radius:999px;background:none;color:var(--p3-ink);font-weight:600;font-size:13.5px}
.p3-m3-b[hidden]{display:none}
.p3-m3-b svg{width:17px;height:17px}
.p3-m3-b:hover{background:#F0F1F4}
.p3-m3-b.on{background:var(--p3-accent);color:var(--p3-accent-ink)}
.p3-m3-hint{position:absolute;left:50%;top:66px;transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:rgba(21,24,33,.82);color:#fff;font-size:13px;white-space:nowrap;pointer-events:none}
.p3-m3-hint[hidden]{display:none}
.p3.m3-on .p3-svg,.p3.m3-on .p3-hot,.p3.m3-on .m3-off{display:none}
@media (max-width:760px){.p3-m3-bar{top:76px}.p3-m3-hint{top:126px}.p3-m3-b span{display:none}.p3-m3-b{padding:0 10px}}
.p3-thumb-b{position:relative}
.p3-thumb-3d{position:absolute;left:5px;top:5px;padding:1px 5px;border-radius:5px;background:rgba(21,24,33,.78);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.03em}
.p3.editing .p3-m3-hint{top:124px}
@media (max-width:760px){.p3.editing .p3-m3-hint{top:176px}}
.p3-corner .p3-hs-dot{width:30px;height:30px;border-radius:50%;background:var(--p3-accent);color:var(--p3-accent-ink);border:3px solid #fff;font:700 13px var(--f-body);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:grab}
.p3-corner:active .p3-hs-dot{cursor:grabbing;transform:scale(1.15)}
.pl-wall{fill:none;stroke:#151821;stroke-linecap:round;stroke-linejoin:round}
.p3-loupe{position:absolute;z-index:30;width:168px;height:168px;border-radius:50%;border:3px solid #fff;box-shadow:0 6px 24px rgba(0,0,0,.45);pointer-events:none;background:#000}
.p3-ovh{display:block;width:100%;max-width:240px;aspect-ratio:1;border-radius:10px;margin:4px 0 10px;background:#000}
.p3-stair .p3-hs-dot{width:44px;height:44px;background:var(--p3-accent);color:var(--p3-accent-ink);border-color:#fff}
.p3-stair .p3-hs-dot .ic{width:22px;height:22px}
.p3-stair .p3-hs-label{bottom:auto;top:calc(100% + 2px);font-weight:700}

/* ---------- app shell ---------- */
#app{height:100%}
#app.lib{height:100%;overflow:hidden}
#app.tour{height:100%;overflow:hidden}
.tour-root{height:100%}

.btn{height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.pri:hover{filter:brightness(1.06)}
.btn.icon{width:42px;padding:0}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.ghost{background:none;border-color:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{height:34px;padding:0 12px;font-size:13.5px}

/* layout */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);height:100%}
.side{--sb-bg:#FFFFFF;--sb-fg:hsl(222 20% 14%);--sb-acc:hsl(197 100% 96%);--sb-acc-fg:hsl(197 100% 28%);--sb-line:hsl(220 13% 91%);background:var(--sb-bg);border-right:1px solid var(--sb-line);display:flex;flex-direction:column;gap:2px;padding:0 8px 8px;overflow-y:auto;min-height:0}
:root[data-theme="dark"] .side{--sb-bg:hsl(222 22% 9%);--sb-fg:hsl(220 14% 96%);--sb-acc:hsl(197 60% 16%);--sb-acc-fg:hsl(197 100% 80%);--sb-line:hsl(222 16% 18%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .side{--sb-bg:hsl(222 22% 9%);--sb-fg:hsl(220 14% 96%);--sb-acc:hsl(197 60% 16%);--sb-acc-fg:hsl(197 100% 80%);--sb-line:hsl(222 16% 18%)}}
.side-brand{display:flex;flex-direction:row;align-items:center;gap:10px;min-height:80px;margin:0 -8px 8px;padding:0 20px;border-bottom:1px solid var(--sb-line);text-decoration:none;color:var(--sb-fg)}
.side-brand svg{width:28px;height:28px;flex:none;display:block}
.pg-brand{display:inline-flex;align-items:center;gap:8px}
.pg-brand .pg-mark{width:1.4em;height:1.4em;flex:none}
.side-brand .pp-word{font-weight:600;font-size:15px;letter-spacing:-.01em;color:var(--sb-fg)}
.side-brand .side-app{margin-left:auto}
.side-brand img{max-height:28px;max-width:120px;display:block}
.wordmark{font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1}
.side-app{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--sb-acc);color:var(--sb-acc-fg);padding:2px 6px;border-radius:6px}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-cur,.side-burger{display:none}
.nav{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:6px;background:none;color:var(--sb-fg);font-weight:500;font-size:14px;text-align:left;text-decoration:none;transition:background-color .15s ease-out,color .15s ease-out}
.nav .ic{width:18px;height:18px}
.nav:hover{background:var(--sb-acc);color:var(--sb-fg)}
.nav.on{background:color-mix(in srgb,var(--accent) 6%,transparent);box-shadow:inset 2px 0 0 0 var(--accent);color:var(--sb-acc-fg)}
.nav.on .ic{color:var(--accent)}
.nav .nl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .dot{width:8px;height:8px;border-radius:999px;flex:none;margin:0 5px}
.nav .ed{width:28px;height:28px;border:0;border-radius:6px;background:none;color:var(--muted);display:grid;place-items:center;padding:0;opacity:0}
.nav:hover .ed,.nav .ed:focus-visible{opacity:1}
.nav .ed .ic{width:15px;height:15px}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:16px 12px 6px;font-size:12px;font-weight:400;color:var(--muted)}
.side-add{width:26px;height:26px;border:0;border-radius:6px;background:var(--sb-acc);color:var(--sb-acc-fg);display:grid;place-items:center;padding:0}
.side-add .ic{width:15px;height:15px}
.side-foot{margin-top:auto;padding-top:8px;border-top:1px solid var(--sb-line);display:flex;flex-direction:column;gap:2px}
.side-empty{padding:4px 12px;font-size:13px;color:var(--muted)}
.main{min-width:0;min-height:0;overflow-y:auto}
.main-in{max-width:1280px;margin:0 auto;padding:22px 28px 56px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.topbar h1{margin:0 auto 0 0;font:800 26px/1.15 var(--f-display);letter-spacing:-.01em;min-width:0;text-wrap:balance}
.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);width:min(340px,100%)}
.search input{border:0;outline:0;background:none;color:var(--ink);width:100%;min-width:0;height:100%}
.search:focus-within{border-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:18px 0 16px}
.chip{height:32px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.filters .count{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{display:flex;gap:10px;align-items:flex-start;margin:16px 0 0;padding:10px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:14px}
.note .ic{color:var(--warn);margin-top:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(264px,1fr));gap:20px}
.card{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(16,24,40,.06),0 12px 28px rgba(16,24,40,.14)}
.card-img{position:relative;aspect-ratio:16/10;background:var(--tint);display:grid;place-items:center;color:var(--muted);overflow:hidden}
.card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:10px;top:10px;height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;background:#fff;color:#151821;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:#8A909B}
.badge.ready::before{background:#1E7F4F}.badge.shared::before{background:#1F6FB2}.badge.draft::before{background:#C68A12}
.card-count{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:999px;background:rgba(17,19,23,.72);color:#fff;font-size:12px;font-weight:600}
.card-count .ic{width:14px;height:14px}
.card-body{padding:13px 15px 14px;display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.card h2{margin:0;font:700 16.5px/1.3 var(--f-display);overflow-wrap:anywhere}
.desc{margin:0;font-size:13px;color:var(--ink);opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr{margin:0;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px}
.dchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;background:var(--tint);font-size:12px;font-weight:600;color:var(--ink);max-width:100%}
.dchip i{width:8px;height:8px;border-radius:2px;flex:none}
.ref{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted)}
.card-foot{margin-top:auto;padding-top:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card.skel{pointer-events:none}
.card.skel .card-img{animation:skel 1.2s ease-in-out infinite alternate}
.card.skel .bar{height:13px;border-radius:4px;background:var(--tint)}
@keyframes skel{from{opacity:.55}to{opacity:1}}
.more{display:flex;justify-content:center;margin-top:24px}
.empty{grid-column:1/-1;background:var(--surface);border-radius:16px;padding:28px 26px 26px;max-width:780px;box-shadow:var(--shadow)}
.empty h2{margin:0 0 6px;font:800 24px/1.2 var(--f-display);text-wrap:balance}
.empty>p{margin:0 0 18px;color:var(--muted);max-width:60ch}
.steps{list-style:none;counter-reset:st;margin:0 0 22px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.steps li{counter-increment:st;font-size:14px;color:var(--muted)}
.steps li::before{content:counter(st);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);font-weight:800;font-size:13px;margin-bottom:8px}
.steps b{display:block;color:var(--ink);font:700 16px/1.25 var(--f-display);margin-bottom:3px}
.tbl-wrap{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow-x:auto;margin-top:18px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl a{color:var(--ink);font-weight:600}
.tbl .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.lib-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:10px 18px;border-radius:999px;background:#151821;color:#fff;font-size:14px;font-weight:600;z-index:60;max-width:90%}

/* modal + sheet */
.md-back{position:absolute;inset:0;background:rgba(15,17,22,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
body>.md-back{position:fixed}
.md{width:min(540px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border-radius:18px;box-shadow:0 24px 64px rgba(0,0,0,.3);-webkit-user-select:text;user-select:text}
.md.wide{width:min(780px,100%)}
.md-head{display:flex;align-items:center;gap:10px;padding:16px 16px 12px 22px}
.md-head h2{margin:0;flex:1;min-width:0;font:800 20px/1.25 var(--f-display)}
.md-x{width:36px;height:36px;border:0;border-radius:50%;background:var(--tint);color:var(--ink);display:grid;place-items:center;padding:0;flex:none}
.md-x:hover{background:var(--line)}
.md-body{padding:6px 22px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;touch-action:pan-y}
.md-body p{margin:0}
.md-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding:14px 22px 18px;border-top:1px solid var(--line)}
.md-foot .left{margin-right:auto}
.sheet{position:absolute;right:68px;top:128px;width:350px;max-height:calc(100% - 300px);min-height:200px;z-index:30;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.35);-webkit-user-select:text;user-select:text}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;min-width:0}
.fld>span{color:var(--muted);font-weight:600}
.fld input[type=text],.fld input[type=number],.fld input[type=search],.fld input[type=email],.fld select,.fld textarea{height:44px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-weight:400;font-size:15.5px;width:100%;min-width:0}
.fld textarea{height:auto;min-height:92px;padding:10px 13px;resize:vertical;line-height:1.45}
.fld input[type=text]:focus,.fld input[type=number]:focus,.fld input[type=email]:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fld small{font-weight:400;color:var(--muted);font-size:12.5px}
.fld input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.fld input[type=color]{width:64px;height:44px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rowf{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chk{display:flex;gap:9px;align-items:center;font-size:14px;font-weight:600}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.seg{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--tint)}
.seg button{flex:1;min-width:0;height:38px;border:0;border-radius:9px;background:none;color:var(--muted);font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 6px;white-space:nowrap}
.seg button .ic{width:16px;height:16px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg.kinds{display:grid;grid-template-columns:1fr 1fr}
.sec{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font:700 16px/1.25 var(--f-display)}
.sec p,.hint{font-size:13.5px;color:var(--muted);margin:0}
.meter{height:8px;border-radius:4px;background:var(--tint);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.mono{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.pw{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:12px;background:var(--tint);font-family:var(--f-mono);font-size:22px;font-weight:500;letter-spacing:.06em}
.pw span{flex:1;min-width:0;overflow-wrap:anywhere}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.colors button{width:30px;height:30px;border-radius:8px;border:2px solid transparent;padding:0}
.colors button.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.dept-bar{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.dept-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:500 12.5px var(--f-body,inherit);cursor:pointer}
.dept-chip:hover{border-color:var(--accent)}
.dept-chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dept-chip .n{font-size:11px;opacity:.7}
.logo-prev{display:flex;align-items:center;justify-content:center;min-height:64px;padding:10px;border:1px dashed var(--line);border-radius:10px;background:#fff}
.logo-prev img{max-height:44px;max-width:220px}
.logo-prev span{color:#151821;font:800 22px var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 16px;border:2px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted);font-size:14px}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.drop b{color:var(--ink);font:700 18px var(--f-display)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.plist li{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;min-width:0}
.plist .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plist .st{font-size:12.5px;color:var(--muted);white-space:nowrap}
.plist .st.ok{color:var(--good)}.plist .st.err{color:var(--crit);white-space:normal;text-align:right}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:p3spin .8s linear infinite;flex:none}
.menu{position:absolute;z-index:50;min-width:200px;padding:6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 12px 34px rgba(0,0,0,.25)}
.menu button{width:100%;height:40px;padding:0 10px;border:0;border-radius:8px;background:none;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;text-align:left}
.menu button:hover{background:var(--tint)}
.menu button.danger{color:var(--crit)}
.menu .ic{width:17px;height:17px}
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.people li{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px}
.people .av{width:28px;height:28px;border-radius:50%;flex:none;background:var(--muted)}
.people .who{flex:1;min-width:0}
.people .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.people .who span{font-size:12.5px;color:var(--muted)}
.tagphoto{max-width:100%;max-height:150px;border-radius:10px;display:block}
video.grab{width:100%;max-height:46vh;background:#000;border-radius:10px}
.steps-help{margin:0;padding-left:20px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.steps-help b{color:var(--ink)}

/* plan editor */
.pe{position:absolute;inset:0;z-index:35;display:flex;flex-direction:column;background:#fff;color:#151821}
.pe-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #E3E6EB}
.pe-head h2{margin:0 auto 0 4px;font:800 19px var(--f-display)}
.pe-head .seg{min-width:240px;background:#EEF0F3}
.pe-head .seg button{color:#5F6672}
.pe-head .seg button.on{background:#fff;color:#151821}
.pe-main{flex:1;min-height:0;display:flex}
.pe-svg{flex:1;min-width:0;min-height:0;touch-action:none;background:
  linear-gradient(rgba(21,24,33,.05) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg,rgba(21,24,33,.05) 1px,transparent 1px) 0 0/40px 40px,#FAFBFC}
.pe-svg .pl-room{cursor:grab}
.pe-side{width:320px;flex:none;border-left:1px solid #E3E6EB;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;font-size:14px;touch-action:pan-y}
.pe-side p{margin:0;color:#5F6672;font-size:13.5px}
.pe-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pe-list li{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:10px;background:#F3F4F6;border:2px solid transparent;cursor:pointer}
.pe-list li.sel{border-color:var(--accent)}
.pe-list .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pe-list .st{font-size:12px;color:#5F6672}
.pe-side label.chk{font-weight:500}

@media (max-width:860px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .side{position:relative;z-index:40;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:0 8px 0 12px;min-height:56px;border-right:0;border-bottom:1px solid var(--sb-line);overflow:visible}
  .side-brand{flex:none;min-height:56px;margin:0;padding:0;border:0;gap:8px}
  .side-brand .pp-word{display:inline}
  .side-brand .side-app{margin-left:0}
  .side-cur{flex:1 1 auto;min-width:0;padding-left:10px;margin-left:2px;border-left:1px solid var(--sb-line);font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-burger{display:grid;place-items:center;flex:none;width:44px;height:44px;border:0;border-radius:8px;background:none;color:var(--sb-fg)}
  .side-burger:hover,.side.open .side-burger{background:var(--sb-acc)}
  .side-nav,.side-foot{display:none}
  .side.open .side-nav,.side.open .side-foot{display:flex;flex-direction:column;flex:1 0 100%;gap:2px}
  .side.open .side-nav{flex:0 0 100%;padding:8px 0;border-top:1px solid var(--sb-line)}
  .side.open .side-foot{padding:8px 0 10px;margin:0;border-top:1px solid var(--sb-line)}
  .side.open{position:fixed;left:0;right:0;top:0;bottom:0;align-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;box-shadow:0 12px 32px rgba(15,23,42,.18)}
  .nav{min-height:44px}
  .nav .ed{display:none}
  .main-in{padding:16px 16px 48px}
  .topbar h1{font-size:22px;width:100%}
  .search{width:auto;flex:1 1 180px}
  .md-back{align-items:flex-end;padding:0}
  .md,.md.wide{width:100%;max-height:92%;border-radius:18px 18px 0 0}
  .sheet{left:0;right:0;top:auto;bottom:0;width:auto;max-height:60%;border-radius:18px 18px 0 0}
  .row2{grid-template-columns:1fr}
  .pe-main{flex-direction:column}
  .pe-side{width:auto;border-left:0;border-top:1px solid #E3E6EB;max-height:44%}
}

.nadir-row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.nadir-prev{width:132px;height:132px;flex:none;border-radius:12px;background:#6B5A48 repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 14px,transparent 14px 28px);display:grid;place-items:center}
.nadir-prev canvas{width:108px;height:108px}
.lnk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lnk li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.lnk .who{flex:1 1 180px;min-width:0}
.lnk .who b{display:block;font-size:14.5px}
.lnk .who span{font-size:12.5px;color:var(--muted)}
.warn{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--warn) 12%,var(--surface));font-size:13.5px}
.warn .ic{color:var(--warn);flex:none}
.pe-auto{border:1px solid #E3E6EB;border-radius:12px;padding:12px;background:#F7F8FA;display:flex;flex-direction:column;gap:8px}
.pe-auto h3{margin:0;font-size:14px}
.pe-auto p{margin:0;font-size:13px;color:#5F6672}
.pe-auto .p3-row{flex-wrap:wrap}
.pe-side select{padding:5px 8px;border-radius:8px;border:1px solid #E3E6EB;background:#fff}

/* card actions (archive / restore) and toast action */
.card-acts{position:absolute;right:8px;top:8px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.card:hover .card-acts,.card:focus-within .card-acts{opacity:1}
@media (hover:none){.card-acts{opacity:1}}
.card-act{width:34px;height:34px;border:0;border-radius:999px;background:#fff;color:#151821;display:grid;place-items:center;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.card-act .ic{width:17px;height:17px}
.card-act:hover{background:#151821;color:#fff}
.card-act.danger:hover{background:var(--crit);color:#fff}
.lib-toast{display:flex;align-items:center;gap:12px}
.lib-toast[hidden]{display:none !important}
.lib-toast button{border:0;border-radius:999px;background:#fff;color:#151821;font-weight:700;font-size:13px;padding:5px 12px}

</style>
</head>

ariant-numeric:tabular-nums}\n.p3-mt.small{font-size:11px}\n.p3-mt.draft{fill:var(--p3-accent)}\n\n/* hotspots */\n.p3-hs{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;border:0;background:none;color:var(--p3-ink);pointer-events:auto;display:grid;place-items:center;will-change:transform;-webkit-tap-highlight-color:transparent}\n.p3-hs-dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .15s;border:3px solid #fff}\n.p3-hs:hover .p3-hs-dot,.p3-hs:focus-visible .p3-hs-dot{transform:scale(1.12)}\n.p3-hs .ic{width:18px;height:18px}\n.p3-nav .p3-hs-dot{background:var(--p3-accent);color:var(--p3-accent-ink)}\n.p3-nav.floor{width:72px;height:72px;margin:-36px 0 0 -36px}\n.p3-nav.floor .p3-hs-dot{opacity:0}\n.p3-k-info .p3-hs-dot{color:#3B4656;border-color:#3B4656}\n.p3-k-damage .p3-hs-dot{color:#C2362A;border-color:#C2362A}\n.p3-k-moisture .p3-hs-dot{color:#1F6FB2;border-color:#1F6FB2}\n.p3-k-equipment .p3-hs-dot{color:#8A6A12;border-color:#8A6A12}\n.p3-blur .p3-hs-dot{background:rgba(255,255,255,.6);border-style:dashed;border-color:#151821}\n.p3-hs-label{position:absolute;bottom:calc(100% - 4px);left:50%;transform:translateX(-50%);max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 10px;border-radius:999px;background:#fff;color:var(--p3-ink);box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:12.5px;font-weight:600;line-height:1.4;pointer-events:none}\n.p3-tag .p3-hs-label{bottom:auto;top:calc(100% - 2px)}\n.p3-nav.floor .p3-hs-label{bottom:calc(50% + 8px)}\n.p3.hide-tags .p3-tag{display:none !important}\n.p3-hs.sel .p3-hs-dot{outline:3px solid var(--p3-accent);outline-offset:3px}\n.p3-nav.floor.sel .p3-hs-dot{opacity:1;width:16px;height:16px}\n\n/* top */\n.p3-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:10px;padding:12px;pointer-events:none}\n.p3-top>*{pointer-events:auto}\n.p3-slot{display:flex;align-items:center;gap:8px;flex:none}\n.p3-slot-r{margin-left:auto}\n.p3-head{display:flex;align-items:center;gap:12px;min-width:0;max-width:min(560px,100%);padding:8px 14px 8px 10px;pointer-events:auto}\n.p3-brand{flex:none;display:flex;align-items:center;max-width:132px;overflow:hidden;padding-right:12px;border-right:1px solid var(--p3-line)}\n.p3-brand:empty{display:none}\n.p3-brand img{max-height:30px;max-width:132px;display:block}\n.p3-brand span{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;color:var(--p3-ink)}\n.p3-titles{min-width:0;flex:1 1 auto}\n.p3-title{font-family:var(--f-display);font-weight:700;font-size:15.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.p3-scene{font-size:12.5px;color:var(--p3-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}\n\n/* buttons */\n.p3-btn{position:relative;width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--p3-card);color:var(--p3-ink);display:grid;place-items:center;padding:0;box-shadow:var(--p3-sh);transition:background .15s,color .15s}\n.p3-btn:hover{background:#fff;color:var(--p3-accent)}\n.p3-btn.on{background:var(--p3-accent);color:var(--p3-accent-ink)}\n.p3-btn.txt{width:auto;border-radius:999px;padding:0 16px;display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:14px;white-space:nowrap}\n.p3-btn .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--p3-accent);color:var(--p3-accent-ink);font:600 11px/18px var(--f-mono);padding:0 4px}\n.p3-tools{position:absolute;right:12px;top:72px;display:flex;flex-direction:column;gap:10px}\n.p3.editing .p3-tools{top:128px}\n\n/* edit bar */\n.p3-editbar{position:absolute;left:0;right:0;top:68px;display:flex;gap:8px;padding:0 12px 6px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}\n.p3-editbar::-webkit-scrollbar{display:none}\n.eb-btn{flex:none;height:42px;padding:0 14px;border-radius:999px;border:0;background:var(--p3-card);color:var(--p3-ink);display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;white-space:nowrap;box-shadow:var(--p3-sh)}\n.eb-btn .ic{width:18px;height:18px}\n.eb-btn:hover{color:var(--p3-accent)}\n.eb-btn.on{background:var(--p3-accent);color:var(--p3-accent-ink)}\n.eb-sep{flex:none;width:1px;margin:8px 2px;background:rgba(255,255,255,.5)}\n\n/* bottom */\n.p3-bottom{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;gap:12px;padding:12px;pointer-events:none}\n.p3-bottom>*{pointer-events:auto}\n.p3-bcol{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}\n.p3-bcol>*{pointer-events:auto}\n.p3-mini{flex:none;width:176px;height:132px;padding:6px;border:0;display:block;overflow:hidden}\n.p3-mini svg{width:100%;height:100%;display:block}\n.p3-strip{max-width:min(100%,980px);padding:4px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}\n.p3-strip-tab{height:22px;padding:0 10px;border:0;border-radius:999px;background:none;color:var(--p3-muted);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}\n.p3-strip-tab:hover{color:var(--p3-ink)}\n.p3-strip-tab .ic{width:14px;height:14px;transition:transform .2s}\n.p3-strip.closed .p3-strip-tab .ic{transform:rotate(180deg)}\n.p3-strip.closed .p3-strip-row{display:none}\n.p3-strip-row{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:2px;scrollbar-width:thin;touch-action:pan-x}\n.p3-thumb{position:relative;flex:none;width:88px}\n.p3-thumb-b{display:block;width:100%;padding:0;border:0;border-radius:10px;background:#E8EAEE;overflow:hidden;color:var(--p3-ink);text-align:left;box-shadow:inset 0 0 0 2px transparent}\n.p3-thumb.on .p3-thumb-b{box-shadow:0 0 0 3px var(--p3-accent)}\n.p3-thumb-img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#E8EAEE}\n.p3-thumb-name{display:block;padding:3px 6px 4px;font-size:11px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff}\n.p3-thumb-m{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:#fff;color:var(--p3-ink);display:grid;place-items:center;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.3)}\n.p3-thumb-m .ic{width:16px;height:16px}\n.p3-thumb-add{flex:none;width:88px;border:2px dashed #C9CED6;border-radius:10px;background:var(--p3-tint,#F7F8FA);color:var(--p3-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;padding:6px}\n.p3-thumb-add:hover{border-color:var(--p3-accent);color:var(--p3-accent)}\n\n/* panel */\n.p3-panel{align-self:flex-start;width:360px;max-width:100%;max-height:min(50vh,460px);overflow:auto;padding:14px 16px 16px;-webkit-user-select:text;user-select:text;touch-action:pan-y}\n.p3-panel h3{margin:0;font:700 16.5px/1.25 var(--f-display)}\n.p3-ph{display:flex;align-items:center;gap:8px;margin-bottom:10px}\n.p3-ph h3{flex:1;min-width:0}\n.p3-x{width:32px;height:32px;border:0;border-radius:50%;background:#EEF0F3;color:var(--p3-ink);display:grid;place-items:center;padding:0;flex:none}\n.p3-x:hover{background:#E2E5EA}\n.p3-seg{display:flex;gap:4px;padding:3px;border-radius:10px;background:#EEF0F3;margin-bottom:10px}\n.p3-seg button{flex:1;height:36px;border:0;border-radius:8px;background:none;color:var(--p3-muted);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 6px}\n.p3-seg button .ic{width:16px;height:16px}\n.p3-seg button.on{background:#fff;color:var(--p3-ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}\n.p3-hint{font-size:13.5px;color:var(--p3-muted);margin:0 0 10px}\n.p3-mlist{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:4px}\n.p3-mlist li{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;background:#F3F4F6;font-size:13.5px}\n.p3-mlist .v{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}\n.p3-mlist button{width:28px;height:28px;border:0;border-radius:6px;background:none;color:var(--p3-muted);display:grid;place-items:center;padding:0;flex:none}\n.p3-mlist button:hover{color:var(--crit,#C2362A);background:#fff}\n.p3-mlist .ic{width:16px;height:16px}\n.p3-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.p3-mini-btn{height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--p3-line);background:#fff;color:var(--p3-ink);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}\n.p3-mini-btn:hover{border-color:#B9BFC9}\n.p3-mini-btn.pri{background:var(--p3-accent);color:var(--p3-accent-ink);border-color:transparent}\n.p3-mini-btn .ic{width:16px;height:16px}\n.p3-note{font-size:12px;color:var(--p3-muted);margin:10px 0 0}\n.p3-camh{font-family:var(--f-mono);font-size:12.5px;color:var(--p3-muted);margin-left:auto}\n.p3-kchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 7px;border-radius:999px;font:700 11.5px/1 var(--f-body);letter-spacing:.03em;text-transform:uppercase;color:#fff;background:#3B4656}\n.p3-kchip .ic{width:14px;height:14px}\n.p3-kchip.damage{background:#C2362A}.p3-kchip.moisture{background:#1F6FB2}.p3-kchip.equipment{background:#8A6A12}\n.p3-tagtext{white-space:pre-wrap;font-size:14.5px;line-height:1.5;margin:8px 0 0;color:#2A2F38}\n.p3-tagphoto{display:block;max-width:100%;border-radius:10px;margin-top:10px}\n.p3-tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}\n.p3-tl button{width:100%;display:flex;align-items:center;gap:10px;padding:8px;border:0;border-radius:9px;background:#F3F4F6;color:var(--p3-ink);text-align:left}\n.p3-tl button:hover{background:#E9EBEF}\n.p3-tl .t{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap; // ---------- import a view-only file (moves tours from the Claude page, or between installations) ----------
function importDialog() {

  const m = A.modal({ title: 'Importér rundvisning', body: [h('p', { text: 'Vælg en visningsfil (.html), der er lavet under Del, Fil til forsikring. Rundvisningen bliver oprettet her med alle scener, forbindelser, markeringer og målinger. Er filen beskyttet, skal du bruge adgangskoden.' }),
    h('div', { class: 'rowf' }, h('button', { class: 'btn pri', type: 'button', onclick: () => file.click() }, icon('upload'), 'Vælg fil'), file)] });
  file.addEventListener('change', async () => { const f = file.files[0]; if (!f) return; m.close(); importFile(f); });
}
async function importFile(f) {
  const st = h('p', { text: 'Læser filen…' }), m = A.modal({ title: 'Importerer', sticky: true, body: st });
  try {
    const txt = await f.text(), meta = /<script type="application\/json" id="p3-meta">([\s\S]*?)<\/script>/.exec(txt), pack = /<script type="text\/plain" id="p3-pack">([\s\S]*?)<\/script>/.exec(txt);
    if (!meta || !pack) throw new Error('format');
    const mt = JSON.parse(meta[1]); let bytes = await P.b64bytes(pack[1].replace(/\s+/g, ''));
    if (mt.enc) {
      m.close(); const pw = await A.promptBox('Filen er beskyttet', 'Adgangskode', '', { ok: 'Åbn' }); if (pw == null) return;
      try { const key = await P.deriveKey(pw.trim(), await P.b64bytes(mt.enc.salt), mt.enc.it); bytes = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: await P.b64bytes(mt.enc.iv) }, key, bytes)); }
      catch (e) { A.toast('Adgangskoden er forkert.', 4000); return; }
      return importBytes(bytes, A.modal({ title: 'Importerer', sticky: true, body: st }), st);
    }
    return importBytes(bytes, m, st);
  } catch (e) { m.close(); A.toast('Filen kunne ikke læses. Brug en visningsfil fra Del, Fil til forsikring.', 5000); }
}
async function importBytes(u8, m, st) {
  try {
    const hl = new DataView(u8.buffer, u8.byteOffset, u8.byteLength).getUint32(0), head = JSON.parse(new TextDecoder().decode(u8.subarray(4, 4 + hl))), base = 4 + hl;

    const tour = Object.assign({}, src, { dept: S.view.kind === 'dept' ? S.view.dept : (src.dept && deptById(src.dept) ? src.dept : ''), status: 'draft', arch: false, createdAt: now, updatedAt: now, by: S.store.uid, updatedBy: S.store.uid, links: [], order: [], count: 0, coverAsset: '' });
    if (tour.plan && tour.plan.url && typeof tour.plan.url === 'object') { try { tour.plan.asset = await S.store.putBlob(part(tour.plan.url), 'image/jpeg'); } catch (e) {} delete tour.plan.url; }
    const scenes = head.scenes || [];
    for (let i = 0; i < scenes.length; i++) {
      const sc = scenes[i]; st.textContent = 'Uploader scene ' + (i + 1) + ' af ' + scenes.length + '…';
      const p = await A.processPano(part(sc.src), +S.cfg.quality || 5760), sid = sc.id || uid();
      const out = Object.assign({}, sc, { asset: await S.store.putBlob(p.blob, 'image/jpeg'), w: p.w, h: p.h, thumb: p.thumb, at: now + i }); delete out.src; delete out.id;
      for (const x of out.hotspots || []) if (x.photoSrc && typeof x.photoSrc === 'object') { try { x.photo = await S.store.putBlob(part(x.photoSrc), 'image/jpeg'); } catch (e) {} delete x.photoSrc; }
      await S.store.setScene(id, sid, out); tour.order.push(sid);
      if (!tour.coverAsset) { try { tour.coverAsset = await S.store.putBlob(p.coverBlob, 'image/jpeg'); } catch (e) {} }
    }
    tour.count = tour.order.length; await S.store.setTour(id, tour); m.close(); A.toast('Rundvisningen er importeret.'); location.hash = 't-' + id;
  } catch (e) { m.close(); A.toast(A.uploadError(e), 5000); }
}

function route() {

  if (lk) { if (S.unsubList) { S.unsubList(); S.unsubList = null; } if (!S.cur || S.cur.link !== lk[1]) openTour(null, lk[1]); return; }
  if (m) { if (S.unsubList) { S.unsubList(); S.unsubList = null; } if (!S.cur || S.cur.id !== m[1]) openTour(m[1]); } else renderLibrary();
}

  try { S.store = await A.initStore(); await S.store.ready; } catch (e) { S.store = await A.initStore(); }
  if (S.store.mode === 'supabase') { S.store.sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') { S.recovering = true; renderNewPassword(); } }); if (/type=recovery/.test(location.hash)) { S.recovering = true; return renderNewPassword(); } }

  applyBrand();
  if (S.store.mode === 'supabase' && !/^#l-/.test(location.hash)) { if (S.store.signedOut) return renderLogin(); if (S.store.role === 'pending') return renderPending(); }
  S.store.watchDepts(list => { S.depts = list; syncFromPolyPlan(); if (S.view.kind === 'dept' && !deptById(S.view.dept) && S.depts.length) { /* department removed */ } renderSide(); if (S.gridEl && S.gridEl.isConnected) { renderMain(); } }, () => {});
  S.store.listShares().then(r => { S.insurers = Array.from(new Set(r.map(x => x.insurer).filter(Boolean))).sort(); }, () => {});
  window.addEventListener('hashchange', route); route();
}
A.boot = boot; boot();
})();
